[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "EDA, GridSearchCV e avaliação de treino/validação em manutenção preditiva"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<3", "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14", "nbformat>=5.10,<6", "nbclient>=0.10,<1",
  "ipykernel>=6.29,<8", "jupyterlab>=4,<5",
  "scikit-learn>=1.6,<2", "xgboost>=3,<4", "joblib>=1.4,<2",
  "scipy>=1.12,<2",
  "imbalanced-learn>=0.14,<0.15",
  "optuna>=4,<6",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
