name: TWF feature ablation CV only

on:
  push:
    branches:
      - experiment/twf-feature-ablation-cv
    paths:
      - 'src/predictive_maintenance/twf_experiment.py'
      - 'scripts/run_twf_ablation.py'
      - 'tests/test_twf_experiment.py'
      - '.github/workflows/twf-ablation.yml'
      - 'README.md'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: CV-only TWF ablation
        run: python scripts/run_twf_ablation.py
      - name: Export CV reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twf-feature-ablation-cv
          path: reports/twf_ablation/
          if-no-files-found: warn
          retention-days: 14
