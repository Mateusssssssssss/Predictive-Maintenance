name: Experimento de validação balanceamento e threshold

on:
  push:
    branches: [experiment/validation-balancing-20261103, experiment/recall90-threshold-optuna-20261103]

jobs:
  training:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Train validation only (no TEST)
        run: python scripts/train_advanced.py --model all
      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-balancing-results
          path: |
            reports/experiments/
            reports/metrics/
            reports/comparisons/
          if-no-files-found: warn
          retention-days: 14
